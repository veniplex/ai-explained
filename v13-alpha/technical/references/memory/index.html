      <article class="page">
        <h1>Memory &amp; compaction</h1>
        <p>The model remembers nothing between requests, so memory means notes kept outside the context and loaded again when needed.</p>
        <p>Memory holds things like your preferences, decisions already made and progress on a long job. The harness saves these notes in files or a database and puts the relevant ones back into the context in a later chat or job. Compaction solves a different problem: on a long job the context fills up, so the harness summarises or removes older steps and keeps the latest ones word for word.</p>
        <p>Inside a run, the context window is short-term memory. Long-term memory lives outside it and is loaded when relevant: files the agent reads and writes (notes, progress logs, instruction files), memory tools and stores, or vector and graph databases. Research borrowed three kinds from cognitive science: episodic (what happened), semantic (facts) and procedural (how to do things, in practice instruction files and skills).</p>
        <p>File-based memory, such as Markdown notes, progress logs and git history, is simple, transparent and works across harnesses; memory tools in APIs let the agent create, read and update its own memory files. Do not remember everything: stale or wrong memories mislead the agent. Store personal data only with consent, retention rules and a way to delete it, and make memory visible and editable.</p>
        <p>Compaction replaces older history with a summary (decisions made, open problems, files touched) and keeps recent turns word for word. Context editing removes stale items automatically, such as old tool results. Some harnesses compact automatically near the limit, others on command, and APIs offer it on the server side.</p>
        <p>Poor compaction makes the agent forget decisions or redo work. Keep error details it still needs, let users say what to keep, and pair compaction with a progress file and version control, so a fresh context can pick up where the old one stopped.</p>
        <p>Compaction &amp; context editing: When the context fills up, the harness summarises older steps or removes stale ones so the agent can keep working.</p>
