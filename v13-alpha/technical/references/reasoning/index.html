      <article class="page">
        <h1>Reasoning (thinking models)</h1>
        <p>A reasoning model, also called a thinking model, works through a problem step by step before it answers.</p>
        <p>The model writes out its thinking before it answers. This thinking is extra text, counted in tokens (small pieces of words) like the answer itself, so the answer takes longer and costs more, even when the app hides it. In return, the model does better at maths, planning and code. Many apps let you set how hard it thinks; this is often called the effort level.</p>
        <p>Reasoning models are trained with reinforcement learning (learning by trial and reward) to write a chain of thought, their reasoning in words, before the final answer. Spending more computing power while answering, called test-time compute, reliably improves results on maths, coding and multi-step problems.</p>
        <p>Most model APIs (the connections programs use to call a model) now offer an effort or thinking level, for example from low to max, rather than a fixed number of thinking tokens. With adaptive thinking, the model decides how long to think within the level you set. Thinking tokens are billed like the answer, even when they are hidden. In agents, models also think between tool calls (interleaved thinking), so they can reflect on a surprising result before choosing the next action.</p>
        <p>Use high effort for planning, debugging, maths and complex trade-offs, and lower effort for simple steps where speed matters, such as sorting requests (routing) or pulling fields out of text (extraction). Maximum effort everywhere is slower, more expensive and sometimes worse on simple tasks; tune it per step, as you would choose a model per step. Reasoning models need fewer step-by-step instructions: give clear goals, context and success criteria instead. And do not read the visible reasoning as a faithful record of how the model reached its answer; research shows it often is not.</p>
      </article>
