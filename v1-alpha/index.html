<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agentic AI, Explained</title>
  <meta name="description" content="A hand-drawn, interactive map of every building block of agentic AI as of October 2026: models, providers, harnesses, the agent loop, context engineering, skills, playbooks, RAG, MCP, tools, sub-agents, hooks, guardrails, evals and more. Each block starts with a simple picture, then the details and vetted sources.">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://veniplex.github.io/ai-explained/v1-alpha/">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Agentic AI, Explained">
  <meta property="og:description" content="Every building block of an AI agent on one hand-drawn map: a simple picture first, then what it is, when it enters a run, and where to learn more. Snapshot: October 2026.">
  <meta property="og:url" content="https://veniplex.github.io/ai-explained/v1-alpha/">
  <meta property="og:image" content="https://veniplex.github.io/ai-explained/v1-alpha/assets/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* Set the theme before first paint: the saved choice, else the system setting.
       The stylesheet reads only data-theme, so this always sets it. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("ae-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#map">Skip to the map</a>

  <header class="bar">
    <a class="brand" href="./" aria-label="Agentic AI, Explained: home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="brand-ring" d="M25.6 12.4C23.9 7.6 18.6 5 13.8 6.6 8.9 8.2 6.3 13.6 7.9 18.5c1.6 4.9 6.9 7.6 11.8 6 2.6-.9 4.6-2.8 5.6-5.2"/>
        <path class="brand-ring" d="M26.6 6.8l-.9 5.8-5.6-1.6"/>
        <circle class="brand-dot" cx="16.6" cy="16" r="3.4"/>
      </svg>
      <span class="brand-title">Agentic AI<span class="brand-tail">, <em>explained</em></span></span>
    </a>
    <span class="brand-sub">Every building block on one map · October 2026</span>

    <div class="bar-actions">
      <div class="search" id="search">
        <button class="icon-btn search-open" type="button" id="search-open" aria-label="Find a block" aria-controls="block-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label class="visually-hidden" for="block-search">Find a building block</label>
          <input id="block-search" type="search" placeholder="Find a block…" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-describedby="search-status">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <ul class="search-results" id="search-results" hidden></ul>
        <p class="visually-hidden" id="search-status" aria-live="polite"></p>
      </div>
      <button class="btn btn-ghost" type="button" id="menu-btn" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
        <span class="btn-label">Guides</span>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="main">
    <h1 class="visually-hidden">Agentic AI, explained: every building block of an AI agent on one map</h1>
    <section class="map" id="map" aria-label="Map of the building blocks of an AI agent" tabindex="-1">
      <noscript>
        <p>This map is interactive and needs JavaScript. All of its content is also in <code>assets/js/data.js</code> in the <a href="https://github.com/veniplex/ai-explained">GitHub repository</a>.</p>
      </noscript>
    </section>
  </main>

  <!-- Everything below opens on interaction. -->
  <nav class="menu" id="menu" aria-label="Guides" hidden></nav>

  <section class="player" id="player" aria-label="Walkthrough of one agent run" hidden>
    <div class="player-head">
      <span class="badge badge-clay player-count" id="p-count">Step 01 / 16</span>
      <h2 class="player-title" id="p-title">A task arrives</h2>
      <button class="icon-btn" type="button" id="p-close" aria-label="Close the walkthrough" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="player-text" id="p-text" aria-live="polite"></div>
    <div class="player-foot">
      <div class="player-ctrl">
        <button class="icon-btn icon-btn-outline" type="button" id="p-prev" aria-label="Previous step" title="Previous step (←)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn icon-btn-ink" type="button" id="p-play" aria-label="Pause" title="Play / pause (space)">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg>
        </button>
        <button class="icon-btn icon-btn-outline" type="button" id="p-next" aria-label="Next step" title="Next step (→)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="route" id="route" role="group" aria-label="Steps"></div>
      <button class="link-btn player-more" type="button" data-guide="steps">All steps</button>
    </div>
  </section>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1" hidden>
    <div class="drawer-head">
      <span class="eyebrow drawer-eyebrow" id="drawer-eyebrow"></span>
      <h2 class="drawer-title" id="drawer-title">Details</h2>
      <button class="icon-btn drawer-close" type="button" id="drawer-close" aria-label="Close details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot">
      <button type="button" id="drawer-prev"></button>
      <button type="button" id="drawer-next"></button>
    </div>
  </aside>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-head">
        <p class="eyebrow sheet-eyebrow" id="sheet-eyebrow"></p>
        <h2 class="sheet-title" id="sheet-title">Guide</h2>
        <p class="sheet-lede" id="sheet-lede"></p>
        <button class="icon-btn sheet-close" type="button" id="sheet-close" aria-label="Close and return to the map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script src="assets/vendor/rough.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="../versions.js"></script>
  <script src="../version-switcher.js"></script>
</body>
</html>
