      <article class="page page-entry">
        <h1>Prompt injection &amp; security</h1>
        <p>Prompt injection hides instructions in text an agent reads, to hijack what it does.</p>
        <p>Agents read text from strangers, such as web pages and emails, while holding real permissions. A model cannot reliably tell your instructions from an attacker's. The dangerous mix is private data, text from strangers and a way to send data out: with all three, an attacker can trick the agent into sending your data away.</p>
        <p>There is no complete fix yet, so protections are layered: narrow permissions, a sandbox (a sealed-off computer) and your approval for risky steps.</p>
        <p>Prompt injection happens when instructions hidden in content the agent reads (a web page, an email, an issue, a PDF, a tool result) hijack its behaviour. No current model is immune, and a line in the prompt such as “ignore malicious instructions” is no defence.</p>
        <p>Simon Willison's lethal trifecta names the dangerous combination: access to private data, exposure to untrusted content and the ability to communicate externally. An agent with all three can be tricked into sending your data to an attacker. Meta's Rule of Two turns this into a design rule: without human approval, one chat or job should combine at most two of the three.</p>
        <p>Defences are architectural: remove one leg of the trifecta, grant least privilege, run in a sandbox whose outgoing traffic is limited to an allowlist of domains, require human approval for sensitive actions (permissions), keep planning separate from untrusted data, and use short-lived, narrowly scoped credentials instead of long-lived, broad tokens. The OWASP lists for LLM and agentic applications work as checklists.</p>
        <p>Check all this before you give an agent email, browsing, customer data or production systems, and before you install third-party MCP servers, skills or plugins, which are a supply-chain risk. Pin and review them, watch for tool descriptions that change (tool poisoning), and use OAuth with per-user, least-privilege scopes for remote MCP servers.</p>
      </article>
