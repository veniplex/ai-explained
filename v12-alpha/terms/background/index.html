      <article class="page page-entry">
        <h1>Background agents &amp; triggers</h1>
        <p>A background agent starts on its own, works while nobody watches and reports back when it is done.</p>
        <p>Every run starts from a trigger. Usually that is your message, but a run can also start on a schedule, when an email arrives or when a file changes, or when another system reports something (a webhook), such as a new support ticket or a failed automatic check. Long-running agents can work for hours, often in the cloud, and keep notes on their progress.</p>
        <p>With nobody watching, they need narrow permissions, a budget and a sandbox, a sealed-off computer.</p>
        <p>Every run begins with a trigger. Interactive triggers come from a person: a chat message, a command in the editor or terminal, a mention in team chat. Automated triggers come from systems: a cron schedule, a webhook (a new ticket or pull request), a failing automatic build (a CI event), a file landing in storage, or another agent. The trigger decides what the run starts with and whether anyone is watching.</p>
        <p>Unattended triggers therefore need tighter permissions, budgets and sandboxing than interactive ones, above all on untrusted input such as public issues or inbound email (security). Cap turns, time and spend for every run, pass the event in as structured context, and add a link back so people can follow the run.</p>
        <p>Agents can complete ever longer tasks on their own. METR measured the length of tasks that frontier agents, the most capable ones, finish with 50% success: it doubled about every seven months between 2019 and 2025, and faster since. For early 2026 it estimated roughly 12 hours of human work, with wide uncertainty.</p>
        <p>Long runs need help from the harness: durable state and checkpoints, progress files and task lists that survive a fresh context, frequent commits, tests as ground truth, compaction and budgets. Background agents run in cloud sandboxes and report back later; review their results as pull requests or documents. The Ralph loop runs the same agent prompt again and again against a spec and a progress file until the work is done.</p>
        <p>Triggers &amp; events: What starts a run: a person's message, or a schedule, a webhook, a build failure, a new file or another agent.</p>
