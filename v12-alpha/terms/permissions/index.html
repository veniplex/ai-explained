      <article class="page page-entry">
        <h1>Permissions &amp; approval</h1>
        <p>Permissions decide what an agent may do alone, what needs your approval and what is forbidden.</p>
        <p>The harness, the app around the model, checks every action: allowed, ask first, or denied. Approval modes range from asking every time to approving routine actions automatically. You can step in at chosen points to approve, correct or take over. Anything that cannot be undone or that reaches the outside world, such as a payment or an email, should wait for a person.</p>
        <p>Too many approval questions backfire: people start clicking yes without reading.</p>
        <p>Harnesses check every tool call against a policy of allow, ask or deny, often by tool and argument pattern: allow running tests, ask before pushing code, deny reading .env, a file that often holds secret keys. Unlike a prompt, these rules are enforced by code, so the model cannot talk its way past them.</p>
        <p>Permission modes range from read-only planning, through asking every time, to automatic approval inside a sandbox. Some harnesses let a classifier, a separate model, approve routine actions and stop risky ones. Start from least privilege, the fewest rights the task needs. Loosen it for trusted, reversible work in a sandbox; tighten it for production systems, money and secrets. Separate reading from writing, scope credentials per task and share permission settings with the team in version control.</p>
        <p>Human-in-the-loop means planned checkpoints: approving a plan, confirming an irreversible action (a payment, a deletion, an email, a deployment), answering a clarifying question, reviewing the result, or taking over when the agent is stuck. Frameworks pause the run, save its state and resume once the person decides. For some uses, the EU AI Act requires human oversight (governance).</p>
        <p>Approving every trivial step leads to approval fatigue: when people click yes to everything, the control is gone. Use fewer, better checkpoints plus a sandbox, and review at natural points such as the plan or the pull request. Start supervised and widen permissions as evals and logs build trust. Oversight only works when the reviewer has the time, context and authority to say no.</p>
        <p>Human-in-the-loop: Planned points where a person approves, corrects or takes over the agent's work, above all before anything irreversible.</p>
