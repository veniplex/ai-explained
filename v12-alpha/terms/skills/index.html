  <script>

    (function () {
      var m = null;
      try { m = new URLSearchParams(location.search).get("view"); } catch (e) {}
      if (m !== "kitchen" && m !== "technical") { try { m = localStorage.getItem("ae10-mode"); } catch (e) {} }

        try {
          if (/\/v12-alpha\/story\/(index\.html)?(\?|$)/.test(document.referrer.replace(location.origin, ""))) sessionStorage.setItem("ae12-voice", "kitchen");
          m = sessionStorage.getItem("ae12-voice");
        } catch (e) {}
      }
      document.documentElement.setAttribute("data-mode", m === "kitchen" ? "kitchen" : "technical");
    })();

      <article class="page page-entry">
        <h1>Skills &amp; saved prompts</h1>
        <p>A skill is written know-how for one kind of task. The agent loads it only when that task comes up.</p>
        <p>A skill is a folder with a SKILL.md file: step-by-step instructions in plain text, sometimes with small programs the agent can run. Until a task needs it, only its name and a one-line description sit in the context, so even many skills take little room. Since December 2025 the format has been an open standard that many apps support. You can often start one by name, like a saved prompt.</p>
        <p>A skill packages procedural know-how: a SKILL.md file with a name and a description in its header plus Markdown instructions, and optionally scripts, templates and reference files. At the start of a chat or job only each skill's name and description sit in the context, a few dozen tokens each. When a task matches, the model reads the full SKILL.md, and only then the extra files it needs. This is called progressive disclosure.</p>
        <p>Anthropic introduced skills in October 2025 and published the format as an open standard, a public specification any app can adopt, in December 2025. By October 2026 more than 40 products support it, including Codex, GitHub Copilot, VS Code, Cursor and Gemini CLI.</p>
        <p>Use skills for repeatable procedures, for company conventions too large for the instruction file, and for helper scripts, so the agent runs tested code instead of writing it from scratch. Write the description for triggering (“Use when…”), because it decides whether the skill loads. Keep SKILL.md focused, move details into referenced files, keep skills in version control and test them with evals.</p>
        <p>Read skills from untrusted sources before installing them, since they can contain code. Turn successful work and existing procedures into skills, and share them through plugins.</p>
        <p>Playbooks &amp; runbooks: A written, step-by-step procedure for a recurring task, with checks and a definition of done. Best stored as a skill.</p>
        <p>Slash commands &amp; prompt templates: Saved prompts you start by name, such as /review. In 2026 most harnesses folded them into skills.</p>
        <p>Plugins &amp; extensions: Installable bundles of skills, commands, sub-agents, hooks and MCP servers, so a whole setup can be shared with one install. They can run code with your permissions, so install only ones you trust.</p>
      </article>
