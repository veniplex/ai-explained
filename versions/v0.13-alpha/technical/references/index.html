      <article class="page">
        <h1>References</h1>
        <ul>
          <li><a href="model/">Language model (LLM)</a>: A program trained on huge amounts of text to predict what comes next. It reads and writes text, piece by piece.</li>
          <li><a href="reasoning/">Reasoning (thinking models)</a>: A reasoning model, also called a thinking model, works through a problem step by step before it answers.</li>
          <li><a href="context/">Context window</a>: The context is everything the model sees in one request; the context window is its size limit.</li>
          <li><a href="prompt/">Prompt &amp; system prompt</a>: A prompt is the message you send. The system prompt holds standing instructions from whoever built the app, sent with every request.</li>
          <li><a href="tools/">Tools</a>: A tool is something the model can ask to have done, such as a web search or a new row in a spreadsheet.</li>
          <li><a href="mcp/">MCP (Model Context Protocol)</a>: MCP, the Model Context Protocol, is an open standard for connecting AI apps to other software.</li>
          <li><a href="agent-loop/">Agent loop</a>: The cycle that turns a model into an agent: look, act, see the result, repeat.</li>
          <li><a href="harness/">Harness (the agent app)</a>: The harness is the app around the model: it runs the agent loop and does what the model cannot.</li>
          <li><a href="instructions/">Instruction files</a>: Instruction files hold standing rules in plain text. The harness puts them in the context at the start of every new chat or job.</li>
          <li><a href="skills/">Skills &amp; saved prompts</a>: A skill is written know-how for one kind of task. The agent loads it only when that task comes up.</li>
          <li><a href="knowledge/">Looking things up (search &amp; RAG)</a>: Looking things up gives the agent facts it was never trained on, from the web, your files or a company knowledge base.</li>
          <li><a href="memory/">Memory &amp; compaction</a>: The model remembers nothing between requests, so memory means notes kept outside the context and loaded again when needed.</li>
          <li><a href="permissions/">Permissions &amp; approval</a>: Permissions decide what an agent may do alone, what needs your approval and what is forbidden.</li>
          <li><a href="sandbox/">Sandbox</a>: A sandbox is an isolated computer where the agent runs code without touching the rest of your systems.</li>
          <li><a href="hooks/">Hooks &amp; guardrails</a>: Hooks are small programs the harness (the app around the model) runs automatically at fixed moments. Guardrails check what goes into and comes out of the model.</li>
          <li><a href="security/">Prompt injection &amp; security</a>: Prompt injection hides instructions in text an agent reads, to hijack what it does.</li>
          <li><a href="team/">Sub-agents, workflows &amp; teams</a>: Sub-agents are helper agents with their own fresh context; workflows run fixed steps in code.</li>
          <li><a href="background/">Background agents &amp; triggers</a>: A background agent starts on its own, works while nobody watches and reports back when it is done.</li>
          <li><a href="evals/">Evals &amp; observability</a>: Evals are tests for AI: real tasks with clear pass or fail criteria.</li>
          <li><a href="cost/">Cost &amp; providers</a>: AI is billed per token: the small pieces of text that go in and come out.</li>
          <li><a href="governance/">Governance &amp; regulation</a>: Governance means the policies, records and legal duties around using AI in an organisation.</li>
        </ul>
      </article>
