      <article class="page">
        <h1>Harness (the agent app)</h1>
        <p>The harness is the app around the model: it runs the agent loop and does what the model cannot.</p>
        <p>The model only writes text. The harness runs the loop, builds the context, runs the tools the model asks for, enforces permissions (what the agent may do alone and what needs your OK) and keeps track of progress. You meet harnesses in chat apps, code editors, terminals (text windows for commands), browsers and team chat. The same model behaves differently in different harnesses.</p>
        <p>The model only predicts tokens; the harness does everything else. It builds each request (system prompt, instruction files, tool definitions, history), calls the model, reads its tool calls, runs them in a sandbox or through MCP, feeds the results back, compacts the context when it fills up, enforces permissions and hooks, starts sub-agents and saves checkpoints.</p>
        <p>Harness quality is a large part of agent quality: the same model scores very differently in different harnesses, so keep one constant when you compare the other. Harness engineering shapes the environment (tools, documentation, fast tests, guardrails) so agents can do reliable work. Customise an existing harness through instruction files, skills, MCP servers, hooks and permissions rather than forking it (copying and changing its code).</p>
        <p>A surface is where people meet the harness: a chat app, an IDE (a code editor), a terminal, a desktop app, a browser, team chat or an API in your own product. It shapes what the agent sees (the open file, the current page), how it asks for approval and how results appear. Good surfaces show actions, sources and costs. Every page a browser agent reads can carry a prompt injection.</p>
        <p>To put an agent into your own product, use an agent SDK (a code library with the loop, tool calls, state and tracing built in) or a managed runtime that also hosts it. For simple cases, a direct API call and a short loop is often clearer, and open protocols such as MCP reduce lock-in.</p>
        <p>Surfaces &amp; interfaces: Where people meet the agent: chat apps, IDEs, terminals, desktop apps, browsers, team chat or an API.</p>
        <p>Agent SDKs &amp; frameworks: Code libraries for building agents and harnesses, with the loop, tool calls and tracing built in.</p>
