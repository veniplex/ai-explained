      <article class="page page-entry">
        <h1>Sandbox</h1>
        <p>A sandbox is an isolated computer where the agent runs code without touching the rest of your systems.</p>
        <p>It is often a container or a small virtual machine: a sealed-off computer running inside a real one. Inside, the agent sees only the files it needs and can reach only approved websites. If something goes wrong, the damage is mostly contained, and the sandbox can be thrown away. Agents that work in the cloud run in sandboxes like this, and a good sandbox means fewer approval questions.</p>
        <p>Agents become far more capable when they can execute code: run tests, analyse data, convert files, install packages. A sandbox limits the blast radius, how far a mistake can reach, with file-system isolation (only the project folder), network isolation (only allowlisted domains), resource limits and disposable environments. With a good sandbox you can safely let the agent work with far fewer approval requests (permissions).</p>
        <p>Options range from operating-system sandboxing on your laptop, to containers and dev containers (ready-made development setups in a container), to cloud micro-VMs, small virtual machines that start for each task. Ephemeral cloud environments, created for one task and then discarded, return their results as pull requests or files. Model APIs also offer code-execution tools for data analysis without your own infrastructure.</p>
        <p>Use a sandbox for any agent that runs code or shell commands, and always for unattended background agents. Isolate both the file system and the network, and restrict outgoing traffic to an allowlist of domains.</p>
        <p>Do not run agents with full access on your main machine next to production credentials. And do not give an environment that holds secrets unrestricted network access: that makes it possible to send data out to an attacker (security).</p>
      </article>
