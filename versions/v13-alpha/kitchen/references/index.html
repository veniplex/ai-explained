    <noscript>
      <article class="page">
        <h1>References</h1>
        <ul>
          <li><a href="model/">Language model (LLM)</a>: The chef has read every cookbook, knows what usually comes next, and forgets each order the moment it is served.</li>
          <li><a href="reasoning/">Reasoning (thinking models)</a>: Before a tricky dish, the chef stops and plans every step first: slower to start, but fewer dishes burn.</li>
          <li><a href="context/">Context window</a>: The counter: the chef can only use what lies on it, and it has a fixed size.</li>
          <li><a href="prompt/">Prompt &amp; system prompt</a>: The order ticket you hand over: what you want tonight, in your own words.</li>
          <li><a href="tools/">Tools</a>: Knives, pots and an oven: they turn the chef's talk into cooking.</li>
          <li><a href="mcp/">MCP (Model Context Protocol)</a>: The standard plug: any appliance built with it works in any kitchen that has the socket.</li>
          <li><a href="agent-loop/">Agent loop</a>: The chef cooks, tastes and adjusts, again and again, until the dish is right.</li>
          <li><a href="harness/">Harness (the agent app)</a>: The kitchen around the chef: it lays out the counter, runs the appliances and enforces the rules.</li>
          <li><a href="instructions/">Instruction files</a>: House rules, laid on the counter at the start of every shift.</li>
          <li><a href="skills/">Skills &amp; saved prompts</a>: Recipe cards in a box: the chef takes one out only when a dish needs it.</li>
          <li><a href="knowledge/">Looking things up (search &amp; RAG)</a>: The cookbook shelf and the phone to the market: the chef looks facts up instead of guessing.</li>
          <li><a href="memory/">Memory &amp; compaction</a>: The notebook that keeps what must not be forgotten between shifts.</li>
          <li><a href="permissions/">Permissions &amp; approval</a>: Keys to cupboards: some the chef opens alone, some need your OK, some stay locked.</li>
          <li><a href="sandbox/">Sandbox</a>: A sealed test kitchen: experiments can go wrong there without harming anything outside.</li>
          <li><a href="hooks/">Hooks &amp; guardrails</a>: The smoke alarm and the lock on the till: automatic checks that work whatever the chef thinks.</li>
          <li><a href="security/">Prompt injection &amp; security</a>: A note slipped into a delivery: the chef reads it like any order and cannot always tell it from your voice.</li>
          <li><a href="team/">Sub-agents, workflows &amp; teams</a>: A brigade of cooks working on one banquet.</li>
          <li><a href="background/">Background agents &amp; triggers</a>: The night shift that starts on a timer without anyone ordering.</li>
          <li><a href="evals/">Evals &amp; observability</a>: The taste panel that tries every new dish against known good ones.</li>
          <li><a href="cost/">Cost &amp; providers</a>: The bill: every word the chef reads and writes is paid for.</li>
          <li><a href="governance/">Governance &amp; regulation</a>: The health inspector and the house rules book: rules for what a kitchen may do and must record.</li>
        </ul>
